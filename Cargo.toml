[package]
name = "atomanja"
version = "0.1.0"
edition = "2024"
description = "Turns missed Vikunja deadlines into debts owed to a witness."
publish = false

[dependencies]
argon2 = "0.6.0"
axum = "0.8.9"
lettre = { version = "0.11.23", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
maud = { version = "0.27.0", features = ["axum"] }
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
time = { version = "0.3.55", features = ["parsing", "formatting", "serde"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }
web-push = { version = "0.11.0", default-features = false, features = ["hyper-client"] }

[lints.rust]
# Agents may not add `unsafe` (CLAUDE.md). Warn, not forbid: the owner
# may need it in a hot path and decides per site.
unsafe_code = "warn"
missing_docs = "warn"

[lints.clippy]
# No mod.rs. A module is `foo.rs` with its children in `foo/`.
mod_module_files = "deny"
self_named_module_files = "allow"

# The step-4 contract leaves `todo!()` bodies. "Clippy clean" (QA.md)
# therefore also means: no stub left behind at step 6.
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"

# Pedantic on, at lower priority so the lines above win.
pedantic = { level = "warn", priority = -1 }
# Pedantic items that fight the contract style.
module_name_repetitions = "allow"
must_use_candidate = "allow"
